name: Release preflight

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: hm-logging-contracts-release
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate tagged BSR release prerequisites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.73.0
          setup_only: true

      - name: Validate BSR release prerequisites
        shell: pwsh
        env:
          LAST_BSR_COMMIT_ID: ${{ vars.LAST_BSR_COMMIT_ID }}
        run: >
          ./scripts/Validate-BsrRelease.ps1
          -Tag "$env:GITHUB_REF_NAME"
          -LastBsrCommitId "$env:LAST_BSR_COMMIT_ID"

      - name: Validate BSR authentication
        shell: pwsh
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: ./scripts/Validate-BsrAuthentication.ps1
